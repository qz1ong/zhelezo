<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="description" content="Дневник тренировок: подходы, графики силы, рейтинги и учёт травм">

<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/styles.css">

<body>
<nav id="nav" aria-label="Разделы">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="32" height="32"><span>Железо</span></div>
  <button data-act="go" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span>
  </button>
  <button data-act="go" data-tab="log">
    <svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg><span>Дневник</span>
  </button>
  <button data-act="go" data-tab="food">
    <svg viewBox="0 0 24 24"><path d="M12 7.5c-3-2.2-7.5-.3-7.5 4.6 0 4.2 3 8.4 5.2 8.4 1 0 1.5-.6 2.3-.6s1.3.6 2.3.6c2.2 0 5.2-4.2 5.2-8.4 0-4.9-4.5-6.8-7.5-4.6z"/><path d="M12 7.5c0-2 1-3.6 3.2-4.2"/></svg><span>Питание</span>

  </button>
  <button data-act="go" data-tab="injuries">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>Травмы</span>
  </button>
  <button data-act="go" data-tab="profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>Профиль</span>
  </button>
</nav>
<main id="view"></main>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Для работы приложения нужен JavaScript.</noscript>
